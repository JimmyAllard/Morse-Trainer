; PlatformIO Project Configuration File — Morse Trainer (Arduino UNO R3)

; --- Shared settings across every environment ------------------------------
[env]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 9600
; Adjust to whatever the UNO enumerates as inside the dev container/host.
; Run `pio device list` if unsure.
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
    -Wall
    -Wextra

; --- Real firmware -----------------------------------------------------------
; The actual Morse Trainer sketch. Excludes smoke_tests/ so their setup()/
; loop() definitions don't collide with main.cpp's.
[env:uno]
build_src_filter = +<*> -<smoke_tests/>

; --- Simulated hardware smoke tests -------------------------------------------
;   pio run -e lcd_test
;   pio run -e buzzer_test
;   pio run -e button_test

; --- Isolated hardware smoke tests --------------------------------------------
; One peripheral at a time, so wiring/library issues can be diagnosed
; without the rest of the program being finished. Build/upload/simulate
; each independently, e.g.:
;   pio run -e lcd_test -t upload
;   pio run -e buzzer_test -t upload
;   pio run -e button_test -t upload

[env:lcd_test]
build_src_filter = +<smoke_tests/lcd_smoke_test.cpp> -<main.cpp>

[env:buzzer_test]
build_src_filter = +<smoke_tests/buzzer_smoke_test.cpp> -<main.cpp>

[env:button_test]
build_src_filter = +<smoke_tests/button_smoke_test.cpp> -<main.cpp>
