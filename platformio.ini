; PlatformIO Project Configuration File — Morse Trainer (Arduino UNO R3)
;
; LCD1602 is wired in 4-bit direct mode (RS, E, D4-D7 to GPIO pins — see
; include/pins.h), so the built-in "LiquidCrystal" library that ships with
; the Arduino framework is used. No external I2C backpack library needed.

[env:uno]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 9600
; Adjust to whatever the UNO enumerates as inside the dev container/host.
; Run `pio device list` if unsure.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
    -Wall
    -Wextra
